{% extends "base.html" %}
{% block content %}

<section class="page-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">

                <div class="card card-pro">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 22px;">
                                <i class="bi bi-person-plus-fill"></i>
                            </div>
                            <h3 class="section-title mb-1">Đăng ký tài khoản</h3>
                            <p class="text-muted small">Tạo tài khoản mới để đặt hàng và theo dõi tiến độ</p>
                        </div>

                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên đăng nhập</label>
                                {{ form.username }}
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                {{ form.password1 }}
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                {{ form.password2 }}
                            </div>

                            {% if form.errors %}
                            <div class="alert alert-danger rounded-3 small">
                                {{ form.errors }}
                            </div>
                            {% endif %}

                            <button class="btn btn-warning w-100 fw-bold py-2 text-dark rounded-3" type="submit">
                                Hoàn tất đăng ký
                            </button>
                        </form>

                        <p class="text-center text-muted small mt-4 mb-0">
                            Đã có tài khoản?
                            <a href="{% url 'login' %}" class="fw-bold text-primary text-decoration-none">Đăng nhập tại đây</a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

{% endblock %}
